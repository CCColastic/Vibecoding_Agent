[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-agent"
version = "0.1.0"
description = "A minimal ReAct agent runtime for DeepSeek Chat Completions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.52,<3",
    "pydantic>=2.10,<3",
]

[project.scripts]
mini-agent = "mini_agent.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
